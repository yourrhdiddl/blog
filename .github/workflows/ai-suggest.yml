name: ai-suggest
# 관리자가 저장한 글(aiStatus=pending)에 요약·태그·제목 후보를 만들어 ai* 필드에만 저장한다. (결정 #27, #28)
# 필요한 Secrets: GEMINI_API_KEY(기본) 또는 ANTHROPIC_API_KEY(AI_PROVIDER=claude), FIREBASE_SERVICE_ACCOUNT (저장소 Settings > Secrets and variables > Actions)
# 제공자 선택: Settings > Secrets and variables > Actions > Variables 탭의 AI_PROVIDER (gemini 기본 | claude). 결정 #48
# 수동 실행(Run workflow)에서 mode=baseline 을 고르면 AI 도입 전 기준값(요약 자동 대체 비율 등)만 측정한다.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "suggest(제안 생성) 또는 baseline(기준값 측정)"
        default: suggest
        type: choice
        options: [suggest, baseline]
permissions:
  contents: read
concurrency:
  group: ai-suggest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT }}
    steps:
      - uses: actions/checkout@v4
      - name: 필요한 설정이 있는지 확인 (값은 출력하지 않음)
        id: chk
        run: |
          ok=yes
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || ok=no
          if [ "${{ inputs.mode }}" != "baseline" ]; then
            if [ "${AI_PROVIDER:-gemini}" = "claude" ]; then [ -n "$ANTHROPIC_API_KEY" ] || ok=no; else [ -n "$GEMINI_API_KEY" ] || ok=no; fi
          fi
          echo "ready=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = yes ] || echo "::notice::Secrets가 아직 없어 건너뜁니다 (GEMINI_API_KEY 또는 ANTHROPIC_API_KEY, FIREBASE_SERVICE_ACCOUNT)"
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ready == 'yes'
        with:
          node-version: 20
      - name: 단위 테스트 (실패하면 AI를 호출하지 않음)
        if: steps.chk.outputs.ready == 'yes'
        run: node --test scripts/gen-ai.test.mjs
      - if: steps.chk.outputs.ready == 'yes'
        run: npm install --no-save --no-package-lock firebase-admin
      - name: 실행
        if: steps.chk.outputs.ready == 'yes'
        run: node scripts/gen-ai.mjs "${{ inputs.mode || 'suggest' }}"
