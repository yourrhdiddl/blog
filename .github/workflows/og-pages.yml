name: og-pages
# 공개 글의 링크 미리보기 페이지(p/글ID.html)와 대표 사진(og/글ID.jpg)을 자동으로 만든다.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: og-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 프리텐다드 글꼴 설치
        run: |
          mkdir -p ~/.fonts && cd "$(mktemp -d)"
          npm pack pretendard@1.3.9 --silent && tar xzf pretendard-*.tgz
          cp package/dist/public/static/Pretendard-{Regular,Medium,SemiBold,Bold,ExtraBold}.otf ~/.fonts/
          fc-cache -f && fc-list | grep -ci pretendard
      - run: npm install --no-save --no-package-lock sharp
      - run: node scripts/gen-og.mjs
      - name: 바뀐 것이 있으면 저장
        run: |
          git config user.name "og-bot"
          git config user.email "og-bot@users.noreply.github.com"
          git add -A p og
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "chore: 링크 미리보기 페이지 자동 갱신" && git push; fi
