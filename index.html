<meta property="og:description" content="AIPM 수업에서 배운 것을 복습하며 정리하는 블로그">

<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("fonts/PretendardVariable.woff2") format("woff2-variations"),url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations")}
/* v2.0 디자인 통일: 복습 노트(v11)와 같은 흑백 에디토리얼 스타일. 헤어라인 격자, 검정 강조 카드, 회색 형광펜 */
:root{--ink:#111;--paper:#fff;--line:#e3e3e0;--mute:#74746f;--soft:#f6f6f3;--g1:#bdbdb9;--g2:#8c8c88;--g3:#55554f;
--ink-2:#3a3a37;--ink-3:#74746f;--brand:#111;--danger:#b42318;
--display:'Hanken Grotesk','Pretendard Variable',Pretendard,system-ui,sans-serif;
--body:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.7;letter-spacing:-0.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--display);text-wrap:balance;letter-spacing:-0.03em;line-height:1.15}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}
/* 형광펜: 회색이 기본, y만 노랑 */
.hl,mark,mark.m,mark.p{background:linear-gradient(transparent 14%,#d6d6d2 14%,#d6d6d2 94%,transparent 94%);color:inherit;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.y,.hl.y{background:linear-gradient(transparent 14%,#ffe44d 14%,#ffe44d 94%,transparent 94%)}
/* 상단 바 */
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-family:var(--display);font-weight:800;font-size:1.0625rem;letter-spacing:-0.03em}
.logo span{font-weight:500;color:var(--mute)}
nav{display:flex;align-items:center;gap:14px;font:500 13px var(--display);color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--ink);background:var(--paper);font:700 13px var(--display);cursor:pointer;color:var(--ink);transition:background .15s,color .15s}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:var(--g3)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.chip{display:inline-block;font:700 11px var(--display);border:1px solid var(--ink);border-radius:99px;padding:2px 9px;background:var(--ink);color:#fff}
/* 첫 화면 헤어라인 격자 */
.topcards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);border-bottom:1px solid var(--line);padding-top:0;padding-bottom:0}
.dcard,.qcard{display:flex;align-items:center;gap:16px;padding:14px 16px;margin:0;border:0;background:none}
.dcard{border-right:1px solid var(--line)}
.dcard .dn{font:800 clamp(34px,5vw,46px)/1 var(--display);letter-spacing:-0.05em;flex:none;white-space:nowrap}
.dcard .dt{font:700 13px var(--display);margin:0}
.dcard .ds{font-size:12px;color:var(--mute);margin:2px 0 0}
.qcard{display:block}
.qcard .qt{font-size:14px;line-height:1.6;margin:0}
.qcard .qa{font:500 12px var(--display);color:var(--mute);margin:4px 0 0}
.hero{display:grid;grid-template-columns:110px 1fr;border-bottom:1px solid var(--line);padding-top:0;padding-bottom:0}
.bignum{border-right:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding:18px 0}
.bignum b{writing-mode:vertical-rl;transform:rotate(180deg);font:800 clamp(56px,10vw,110px)/.9 var(--display);letter-spacing:-0.05em}
.hero-row{display:grid;grid-template-columns:130px 1fr;border-bottom:1px solid var(--line)}
.hero-row:last-child{border-bottom:0}
.cell-label{font:700 13px var(--display);padding:18px 16px;border-right:1px solid var(--line)}
.cell-body{padding:18px 22px}
.hero h1{font-size:clamp(26px,4.4vw,46px);font-weight:800;line-height:1.2}
.hero .lead{color:var(--ink-2);max-width:62ch;margin:12px 0 0;font-size:15px}
.meta-table{width:100%;border-collapse:collapse;font-size:14px}
.meta-table td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.meta-table tr:last-child td{border-bottom:0}
.meta-table td:first-child{width:90px;color:var(--mute);font:500 13px var(--display)}
/* 오늘의 글 3개 */
.picks{padding-top:30px}
.pickrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.note{padding:16px 18px;border:1px solid var(--line);border-radius:14px;font-size:14px;line-height:1.6;font-weight:600;cursor:pointer;background:var(--paper);box-shadow:0 6px 18px rgba(0,0,0,.05);transition:transform .15s}
.note:hover{transform:translateY(-2px)}
.note:nth-child(1){background:var(--ink);color:#fff;border-color:var(--ink)}
.note small{display:block;margin-top:8px;color:var(--mute);font:500 12px var(--display)}
.note:nth-child(1) small{color:#bdbdb8}
/* 목록 머리글 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:46px;padding-top:12px;border-top:1px solid var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:0}
.tab{min-height:44px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--mute);font:500 14px var(--display);cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.search{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--paper);width:220px;font-size:14px}
/* 글 카드 */
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:22px 0 10px}
.gal .empty{grid-column:1/-1}
.post{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.05);transition:transform .15s}
.post:hover{transform:translateY(-3px)}
.post:first-child{background:var(--ink);color:#fff;border-color:var(--ink)}
.post:first-child .meta,.post:first-child p{color:#e6e6e2}
.post:first-child .tags span{color:#fff;border-color:#8c8c88}
.thumb{aspect-ratio:4/3;overflow:hidden;background:var(--soft);border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;margin:0;border-radius:0;filter:grayscale(1) contrast(1.05)}
.thumb.ph{display:flex;align-items:center;justify-content:center;font:800 2.4rem var(--display);color:rgba(17,17,17,.45)}
.thumb.c0{background:var(--soft)}.thumb.c1{background:#ececE8}.thumb.c2{background:#e3e3e0}.thumb.c3{background:#f0f0ed}
.pbody{padding:16px;display:flex;flex-direction:column;flex:1;gap:0}
.meta{display:flex;align-items:center;gap:8px;font:500 12px var(--display);color:var(--mute);margin-bottom:8px;flex-wrap:wrap}
.badge{display:inline-flex;font:700 11px var(--display);padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.badge.pub{color:var(--ink)}.badge.priv{color:var(--ink);border-style:dashed}
.post:first-child .badge{color:#fff}
.aib{display:inline-flex;font:700 11px var(--display);padding:2px 9px;border-radius:99px;border:1px solid var(--ink);color:var(--ink);background:var(--paper)}
.aib.on{background:#ffe44d}
.post h2{font-size:17px;line-height:1.4;font-weight:800}
.post p{margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.tags{margin-top:auto;padding-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.tags span{font:500 12px var(--display);color:var(--ink-2);padding:1px 9px;border:1px solid var(--line);border-radius:99px}
.empty{padding:48px 0;color:var(--mute);text-align:center}
/* 글 상세 */
.back{display:inline-flex;align-items:center;min-height:44px;margin-top:20px;font:700 13px var(--display);color:var(--ink);cursor:pointer;background:none;border:0}
.article{padding:10px 0 48px;max-width:760px;margin:0 auto}
.article h1{font-size:clamp(26px,4vw,38px);line-height:1.25;font-weight:800;margin:8px 0}
.article .lead{color:var(--ink-2);font-size:17px;margin-bottom:8px}
.article .cover{width:100%;border-radius:14px;margin:0 0 20px;display:block;border:1px solid var(--line)}
.article .body{margin-top:28px;font-size:16.5px;line-height:1.9}
.article .body p{margin:0 0 1.4em}
.article .body h3{font-size:22px;font-weight:800;margin:2em 0 .6em;padding-top:12px;border-top:1px solid var(--ink)}
.article .body h3 span{background:none;padding:0}
.article .body ul,.article .body ol{margin:0 0 1.4em 1.3em}.article .body li{margin-bottom:.4em}
blockquote{margin:0 0 1.6em;padding:16px 20px;border:1px solid var(--ink);border-radius:14px;font-weight:500}
pre{margin:0 0 1.6em;background:var(--ink);color:#f3f3f3;padding:16px 20px;border-radius:14px;overflow-x:auto;max-width:100%;font:500 14px/1.7 var(--body);white-space:pre}
.sample-note{margin:8px 0 12px;padding:10px 14px;border:1px dashed var(--ink);border-radius:10px;font-size:13px;font-weight:600}
.lock{margin:40px auto;max-width:760px;padding:32px;border:1px dashed var(--ink);border-radius:14px;text-align:center}
.lock p{margin:8px 0 16px;color:var(--mute)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:40px}
.pn a{padding:16px;border:1px solid var(--line);border-radius:14px;font-weight:700;line-height:1.5}
.pn a small{display:block;color:var(--mute);font:500 12px var(--display)}
.pn a:hover{border-color:var(--ink)}
.admin-actions{display:flex;gap:8px;margin:16px 0 0}
/* 폼·글쓰기 */
.card{max-width:760px;margin:36px auto;padding:28px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.card h1{font-size:26px;font-weight:800}
form{display:flex;flex-direction:column;gap:18px;margin-top:20px}
label{display:flex;flex-direction:column;gap:6px;font:700 13px var(--display)}
label small{font-weight:500;color:var(--mute)}
input[type=text],input[type=email],input[type=password],textarea{min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font:500 15px/1.7 var(--body)}
input[type=text]:focus,textarea:focus{border-color:var(--ink);outline:0}
textarea{min-height:320px;resize:vertical}
.coverbox{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.coverbox .thumb{width:100%;max-width:280px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:600}
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--soft)}
.tb .tbb{min-width:40px;min-height:40px;padding:0 10px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;font:700 13px var(--display);color:var(--ink)}
.tb .tbb:hover{background:var(--paper);border-color:var(--line)}
.tb select{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0 8px;font-weight:600}
.tb .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.tb .swg{display:grid;grid-template-columns:repeat(10,24px);gap:4px;padding:2px 4px}
.tb .sw{width:24px;min-width:24px;height:24px;min-height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.18);padding:0;cursor:pointer}
.tb .sw:hover,.tb .sw:focus-visible{transform:scale(1.15);outline:2px solid var(--ink);outline-offset:1px}
.tb .tbb.photo{background:var(--ink);color:#fff;border-radius:8px;padding:0 18px;min-height:40px;font-weight:700}
.tb .tbb.photo:hover{background:#333;color:#fff;border-color:transparent}
.ed{min-height:340px;padding:14px 16px;border:1px solid var(--line);border-radius:0 0 10px 10px;background:var(--paper);line-height:1.8;font-weight:500;outline:none}
.ed:focus{border-color:var(--ink)}
.ed:empty:before{content:attr(data-ph);color:var(--g2)}
.ed img,.article .body img{max-width:100%;height:auto;border-radius:10px;display:block;margin:12px 0}
.ed h3{font-size:22px;font-weight:800;margin:1.2em 0 .5em}
.ed blockquote,.article .body blockquote{margin:1em 0}
.ed ul,.ed ol{margin:0 0 1em 1.3em}.ed p,.ed div{margin:0 0 1em}
.article .body font[size="2"],.ed font[size="2"]{font-size:.85em}
.article .body font[size="5"],.ed font[size="5"]{font-size:1.35em}
.article .body font[size="6"],.ed font[size="6"]{font-size:1.8em}
.article .body font[size="1"],.ed font[size="1"]{font-size:.75em}
.article .body font[size="4"],.ed font[size="4"]{font-size:1.2em}
.article .body font[size="7"],.ed font[size="7"]{font-size:2.4em}
.edhint{font-size:13px;color:var(--mute);font-weight:500}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{flex-direction:row;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:99px;background:var(--paper);cursor:pointer;font-weight:600}
.radios label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.radios input{accent-color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* AI 제안 카드 */
.aicard{margin:16px 0;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.aicard.fail{border-style:dashed}.aicard.done{border-color:var(--line);padding:8px 14px}
.aicard label{display:block;margin-top:12px;font:700 13px var(--display)}
.aicard .radios label{display:flex;margin-top:0;font:600 13px var(--display)}
.aicard .radios input,.aicard label>input[type=checkbox]{margin:0 8px 0 0;vertical-align:-2px}
.aicard .radios label:has(input:checked) input{accent-color:#ffe44d}
.aicard textarea{min-height:84px;height:84px;resize:vertical}
.aicard textarea,.aicard input[type=text]{width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font:inherit}
.aicard .aih{margin-top:12px;font:700 13px var(--display)}.aicard .row{margin-top:14px}
.aiopt{display:block;font-weight:600}.aiopt small{display:block;font-weight:500;color:var(--mute)}
/* 사진 갤러리 (v2.1) */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
#list.pgrid{padding:22px 0 10px}.pgrid .empty{grid-column:1/-1}
.pitem{margin:0}
.ptile{display:block;width:100%;aspect-ratio:1/1;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--soft);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.05);transition:transform .15s}
.ptile:hover{transform:translateY(-3px)}
.ptile img{width:100%;height:100%;object-fit:cover;display:block;margin:0;border-radius:0}
.pitem figcaption{margin-top:6px;font:700 12.5px/1.4 var(--display)}
.pitem figcaption small{display:block;font-weight:500;color:var(--mute)}
.gallery{margin:36px 0 0;padding-top:12px;border-top:1px solid var(--ink)}
.gallery .gh{font:800 15px var(--display);margin-bottom:12px}
.gallery .pgrid{grid-template-columns:repeat(3,1fr)}
.pprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.pp{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft)}
.pp img{width:100%;height:100%;object-fit:cover;display:block}
.ppx{position:absolute;top:4px;right:4px;min-width:36px;min-height:36px;border:0;border-radius:99px;background:var(--ink);color:#fff;font:700 13px var(--display);cursor:pointer}
.lb{position:fixed;inset:0;z-index:20;background:rgba(17,17,17,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:min(96vw,1100px);max-height:78vh;object-fit:contain;border-radius:10px;display:block}
.lbcap{color:#fff;font:600 14px var(--display);margin-top:14px;text-align:center}
.lbcap a{text-decoration:underline}
.lb button{position:absolute;min-width:44px;min-height:44px;border:1px solid #fff;border-radius:99px;background:transparent;color:#fff;font:700 20px var(--display);cursor:pointer}
.lb button:hover{background:#fff;color:var(--ink)}
.lb .x{top:16px;right:16px}.lb .pv{left:12px;top:50%}.lb .nx{right:12px;top:50%}
/* 본문 사진 블록 (v2.2) */
.ed figure.pf,.article .body figure.pf{position:relative;margin:1.4em 0;text-align:center}
.ed figure.pf img,.article .body figure.pf img{display:inline-block;max-width:100%;height:auto;margin:0;border-radius:10px;border:1px solid var(--line)}
.article .body figure.pf img{cursor:zoom-in}
.ed figure.pf img{cursor:grab}
.pf figcaption{margin-top:8px;font:500 13px/1.5 var(--display);color:var(--mute);text-align:center}
.ed figure.pf figcaption{min-height:1.5em;outline:none;cursor:text}
.ed figure.pf figcaption:empty:before{content:attr(data-ph);color:var(--g2)}
.ed figure.pf.sel:not(.g2):not(.g3) img,.ed figure.pf.sel img.cur{outline:3px solid var(--ink);outline-offset:2px}
.ed figure.pf.g2,.ed figure.pf.g3,.article .body figure.pf.g2,.article .body figure.pf.g3{display:grid;gap:6px;align-items:start}
.ed figure.pf.g2,.article .body figure.pf.g2{grid-template-columns:repeat(2,1fr)}
.ed figure.pf.g3,.article .body figure.pf.g3{grid-template-columns:repeat(3,1fr)}
.ed figure.pf.g2 img,.ed figure.pf.g3 img,.article .body figure.pf.g2 img,.article .body figure.pf.g3 img{width:100%;aspect-ratio:1/1;object-fit:cover}
.ed figure.pf.g2 figcaption,.ed figure.pf.g3 figcaption,.article .body figure.pf.g2 figcaption,.article .body figure.pf.g3 figcaption{grid-column:1/-1;margin-top:2px}
.ed figure.pf.dragging{opacity:.4}
.phbar{display:none;position:absolute;top:8px;right:8px;gap:6px}
.ed figure.pf.sel .phbar{display:flex}
.phbar button{min-width:40px;min-height:40px;border:0;border-radius:99px;background:var(--ink);color:#fff;font:700 15px var(--display);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ed .dropb{box-shadow:0 -3px 0 var(--ink)}
.ed.drope{box-shadow:inset 0 -3px 0 var(--ink)}
.fab{position:fixed;right:20px;bottom:20px;min-height:52px;padding:0 22px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font:600 13px var(--display);z-index:10;max-width:calc(100vw - 32px);text-align:center}
footer{padding:50px 0 80px;color:var(--mute);font-size:13px;border-top:1px solid var(--line);margin-top:40px}
footer .big{font:800 clamp(40px,10vw,110px)/.95 var(--display);letter-spacing:-0.06em;color:var(--ink);margin-top:24px}

async function purgeOld(){ // 휴지통에 15일 넘게 있던 글을 영구삭제(관리자가 사이트를 열 때 실행)

  if(gone.size){remote=remote.filter(p=>!gone.has(p.id));toast("휴지통에서 "+TRASH_DAYS+"일이 지난 글 "+gone.size+"개를 영구삭제했어요");}
}

const DRAFT_KEY=k=>"aipm_draft_"+(k||"new");
let draftT=0,draftId="";
function draftRead(k){try{const r=localStorage.getItem(DRAFT_KEY(k));return r?JSON.parse(r):null;}catch(e){return null;}}
function draftClear(k){try{localStorage.removeItem(DRAFT_KEY(k));}catch(e){}}
function draftSave(){
  const fm=$("#writeForm"),ed=$("#ed");if(!fm||!ed)return;
  const d=new FormData(fm),html=clean(ed.innerHTML).trim(),t=(d.get("t")||"").trim(),s=(d.get("s")||"").trim(),tg=(d.get("tags")||"").trim();
  const st=$("#draftState");
  if(!t&&!s&&!tg&&!strip(html).trim()&&!/<img /.test(html)){draftClear(draftId);if(st)st.textContent="";return;}
  try{localStorage.setItem(DRAFT_KEY(draftId),JSON.stringify({t,s,tg,v:d.get("v"),html,ts:Date.now()}));
    if(st)st.textContent="임시저장됨 "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Seoul"});}

const RD={sent:new Set(),cur:null};
function gaOk(){return authReady&&!loggedIn&&typeof gtag==="function"&&location.hostname==="yourrhdiddl.github.io";}
function gaEv(name,id,extra){

  const p=all().find(x=>x.id===id);
  const t=p?new DOMParser().parseFromString(p.t,"text/html").body.textContent:"";

function stopRead(){const c=RD.cur;if(!c)return;clearInterval(c.timer);if(c.io)c.io.disconnect();window.removeEventListener("scroll",c.onScroll);RD.cur=null;}
function startRead(view,id){
  stopRead();
  if(view!=="post"||!gaOk())return;
  const body=document.querySelector("#detail .body"),end=document.getElementById("readEnd");
  if(!body||!end)return;
  const chars=body.textContent.replace(/\s/g,"").length;
  const c=RD.cur={ms:0,reached:false,need:Math.max(10000,chars/500*60000*0.5)};
  const once=(name,extra)=>{const k=name+":"+id+":"+(extra&&extra.percent||"");if(RD.sent.has(k))return;RD.sent.add(k);gaEv(name,id,extra);};
  const check=()=>{if(c.reached&&c.ms>=c.need)once("read_end",{engaged_sec:Math.round(c.ms/1000)});};
  c.timer=setInterval(()=>{if(document.visibilityState==="visible"){c.ms+=1000;check();}},1000);
  c.io=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)){c.reached=true;once("read_reach");check();}});c.io.observe(end);
  let raf=0;
  c.onScroll=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const r=body.getBoundingClientRect(),ratio=(innerHeight-r.top)/(r.height||1);[25,50,75].forEach(n=>{if(ratio>=n/100)once("read_progress",{percent:n});});});};
  window.addEventListener("scroll",c.onScroll,{passive:true});c.onScroll();
}

async function qGet(u,pick){const c=new AbortController(),k=setTimeout(()=>c.abort(),5000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;const q=pick(await r.json());if(!q||!q[0]||!q[1])throw 0;return q}finally{clearTimeout(k)}}
async function loadQuote(){
  if(QCUR){qShow(QCUR[0],QCUR[1]);return}
  const f=QUOTES[Math.floor(Math.random()*QUOTES.length)];qShow(f[0],f[1]);
  let q=null;
  try{q=await qGet("https://dummyjson.com/quotes/random",j=>[j.quote,j.author])}catch(e){
    try{q=await qGet("https://api.quotable.kurokeita.dev/api/quotes/random",j=>[j.quote.content,j.quote.author&&j.quote.author.name])}catch(e2){}}
  if(q){QCUR=q;qShow(q[0],q[1])}else QCUR=f;
}
const DATA_GO_KEY="";
function kst(){const f=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"numeric",day:"numeric",weekday:"long"}).formatToParts(new Date()),g=t=>(f.find(x=>x.type===t)||{}).value;return{y:+g("year"),m:+g("month"),d:+g("day"),w:g("weekday")}}
async function dayInfo(k){
  if(!DATA_GO_KEY)return"";
  const base="https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/";
  const ymd=(y,m,d)=>y*10000+m*100+d,today=ymd(k.y,k.m,k.d),out=[];
  for(const op of["getRestDeInfo","get24DivisionsInfo"]){
    try{const r=await fetch(base+op+"?serviceKey="+encodeURIComponent(DATA_GO_KEY)+"&solYear="+k.y+"&solMonth="+String(k.m).padStart(2,"0")+"&numOfRows=50&_type=json");
      const it=((((await r.json()).response||{}).body||{}).items||{}).item;
      (Array.isArray(it)?it:it?[it]:[]).forEach(x=>out.push({n:x.dateName,d:+x.locdate}))}catch(e){}}
  const t=out.find(x=>x.d===today);if(t)return"오늘은 "+t.n;
  const nx=out.filter(x=>x.d>today).sort((a,b)=>a.d-b.d)[0];
  if(nx){const a=new Date(Date.UTC(k.y,k.m-1,k.d)),s=String(nx.d),b=new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6)));return nx.n+" D-"+Math.round((b-a)/864e5)}
  return"";
}
async function loadDate(){
  const k=kst(),doy=Math.round((Date.UTC(k.y,k.m-1,k.d)-Date.UTC(k.y,0,0))/864e5),tot=((k.y%4===0&&k.y%100!==0)||k.y%400===0)?366:365;
  $("#dn").textContent=k.d;$("#dt").textContent=k.y+"년 "+k.m+"월 "+k.w;$("#ds").textContent="올해 "+doy+"일째 · 남은 "+(tot-doy)+"일";
  const x=await dayInfo(k);if(x)$("#ds").textContent=x+" · 올해 "+doy+"일째";
}
function show(view,id,push){
  delArm=0;
  if((view==="write"||view==="edit")&&!loggedIn){after={view,id};view="login";}
  ["home","detail","page"].forEach(n=>$("#"+n).hidden=true);
  if(view==="post"&&all().some(p=>p.id===id)){$("#detail").hidden=false;renderDetail(id);}
  else if(view==="login"){$("#page").hidden=false;renderLogin();}
  else if(view==="write"){$("#page").hidden=false;renderWrite(0);}
  else if(view==="edit"&&remote.some(r=>r.id===id)){$("#page").hidden=false;renderWrite(id);}
  else{view="home";$("#home").hidden=false;renderPicks();renderList();loadQuote();loadDate();}
  if(push){try{history.replaceState(null,"",view==="post"?"#/post/"+id:view==="edit"?"#/edit/"+id:view==="home"?"#/":"#/"+view)}catch(e){}}
  track(view,id);
  window.scrollTo(0,0);
  startRead(view,id);
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-id],[data-home],[data-go],[data-edit],[data-del]");if(!a)return;
  e.preventDefault();
  if(a.dataset.go)return show(a.dataset.go,0,true);
  show(a.dataset.id?"post":"home",a.dataset.id||0,true);
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const fm=e.target,d=new FormData(fm);
  if(fm.id!=="writeForm")return;
  const pid=fm.dataset.pid,lbl=pid?"수정 완료":"발행하기";
  const btn=$("#pubBtn");btn.disabled=true;btn.textContent="저장 중…";
  const tags=d.get("tags").split(/[,\s]+/).map(x=>x.replace(/^#/,"")).filter(Boolean);
  const content=clean($("#ed").innerHTML).trim();
  const plain=strip(content.replace(/<figcaption>[\s\S]*?<\/figcaption>/g,"")).replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();
  if(!plain&&!/<img /.test(content)){btn.disabled=false;btn.textContent=lbl;return toast("내용을 입력해 주세요");}
  if(new Blob([content]).size+coverData.length>950000){btn.disabled=false;btn.textContent=lbl;return toast("글이 너무 커요. 사진 수를 줄여 주세요");}
  const summary=d.get("s").trim()||plain.slice(0,60);
  try{
    if(pid){const patch={title:d.get("t").trim(),summary,tags,content,contentFormat:"html",cover:coverData,visibility:d.get("v")==="private"?"private":"public",summaryAuto:!d.get("s").trim(),updatedAt:serverTimestamp()};
      if(d.get("ai")==="on"){patch.aiStatus="pending";patch.aiError=null;}
      await updateDoc(doc(db,"posts",pid),patch);clearTimeout(draftT);draftClear(pid);await loadRemote();toast("수정했어요");return show("post",pid,true);}
    const ref=await addDoc(collection(db,"posts"),{title:d.get("t").trim(),summary,tags,content,contentFormat:"html",cover:coverData,visibility:d.get("v")==="private"?"private":"public",authorUid:user.uid,createdAt:serverTimestamp(),summaryAuto:!d.get("s").trim(),aiStatus:d.get("ai")==="on"?"pending":"none"});
    clearTimeout(draftT);draftClear("");await loadRemote();toast("발행했어요");show("post",ref.id,true);
  }catch(err){
    console.error(err);btn.disabled=false;btn.textContent=lbl;
    toast(err.code==="permission-denied"?(pid?"권한이 없어요. Firestore 규칙에서 관리자의 수정을 허용해야 해요":"관리자만 글을 쓸 수 있어요"):"저장하지 못했어요. 다시 시도해 주세요");
  }
});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{f=b.dataset.f;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));renderList();});
document.addEventListener("click",async e=>{
  const b=e.target.closest("#shareBtn");if(!b)return;
  const u="https://yourrhdiddl.github.io/blog/p/"+b.dataset.share+".html";
  try{await navigator.clipboard.writeText(u);}
  catch(x){const t=document.createElement("textarea");t.value=u;document.body.appendChild(t);t.select();try{document.execCommand("copy");}catch(y){}t.remove();}
  gaEv("share",b.dataset.share,{method:"copy_link",content_type:"post"});
  toast("공유 링크를 복사했어요 (미리보기는 최대 15분 뒤 반영)");
});
$("#q").oninput=e=>{q=e.target.value.trim();renderList();};
$("#loginBtn").onclick=async()=>{if(loggedIn){await signOut(auth);toast("로그아웃했어요");show("home",0,true);}else show("login",0,true);};
document.addEventListener("click",async e=>{
  if(e.target.id!=="googleBtn")return;
  try{await signInWithPopup(auth,new GoogleAuthProvider());}
  catch(err){console.error(err);const m=$("#loginMsg");if(m){m.textContent="로그인하지 못했어요. 팝업 차단을 풀고 다시 눌러 주세요.";m.style.color="#b42318";}}
});
onAuthStateChanged(auth,async u=>{
  user=u;loggedIn=!!u&&(!ADMIN_UID||u.uid===ADMIN_UID);
  syncAuth();await loadRemote();authReady=true;if(loggedIn)window["ga-disable-G-MNDDLWDCR9"]=true;
  if(u&&loggedIn&&!$("#page").hidden&&$("#loginForm,#googleBtn")){const n=after;after=null;toast("관리자로 로그인했어요");show(n?n.view:"home",n?n.id:0,true);}
  else if(u&&!loggedIn){toast("관리자 계정이 아니에요");await signOut(auth);}
  else fromHash();
});
function fromHash(){const m=location.hash.match(/^#\/post\/([\w-]+)/);if(m)return show("post",m[1],false);
  const ed=location.hash.match(/^#\/edit\/([\w-]+)/);if(ed)return show("edit",ed[1],false);
  const w=location.hash.match(/^#\/(login|write)/);show(w?w[1]:"home",0,false);}
window.addEventListener("hashchange",fromHash);syncAuth();fromHash();
</script>
