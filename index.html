<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 블로그 · 첫 화면 디자인 초안 v0.1</title>
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("fonts/PretendardVariable.woff2") format("woff2-variations");}
:root{
  --bg:#fafaf9; --surface:#fff; --ink:#1a1a1a; --ink-2:#4a4a4a; --ink-3:#6b6b6b;
  --line:#e7e5e4; --brand:#2f5bea; --brand-soft:#eef2ff; --lock:#92400e; --lock-soft:#fef3c7;
  --pub:#166534; --pub-soft:#dcfce7;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--ink);
  font-size:1.0625rem;line-height:1.75;letter-spacing:-0.01em;word-break:keep-all;overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased}
button,input{font:inherit;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}

header{position:sticky;top:0;background:rgba(250,250,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:-0.03em}
.logo span{color:var(--brand)}
nav{display:flex;align-items:center;gap:20px;font-weight:500;color:var(--ink-2);font-size:1rem}
nav a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:hover{filter:brightness(.96)}

.hero{padding-top:72px;padding-bottom:40px}
.hero small{display:block;font-weight:600;color:var(--brand);margin-bottom:12px;font-size:.9375rem}
.hero h1{font-size:2.5rem;line-height:1.3;font-weight:800;letter-spacing:-0.035em}
.hero p{margin-top:16px;color:var(--ink-2);font-size:1.1875rem;line-height:1.7;max-width:34em}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px}
.tab{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid transparent;background:transparent;
  color:var(--ink-2);font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:#fff}
.tab:not([aria-selected=true]):hover{background:#f0efed}
.search{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:200px}

.post{display:block;padding:28px 0;border-bottom:1px solid var(--line)}
.meta{display:flex;align-items:center;gap:10px;font-size:.9375rem;color:var(--ink-3);margin-bottom:8px}
.badge{display:inline-flex;align-items:center;padding:1px 10px;border-radius:999px;font-size:.8125rem;font-weight:700;line-height:1.6}
.badge.pub{background:var(--pub-soft);color:var(--pub)}
.badge.priv{background:var(--lock-soft);color:var(--lock)}
.post h2{font-size:1.5rem;line-height:1.4;font-weight:700;letter-spacing:-0.025em}
.post:hover h2{color:var(--brand)}
.post p{margin-top:8px;color:var(--ink-2)}
.tags{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.tags span{font-size:.875rem;color:var(--ink-3);background:#f0efed;padding:2px 10px;border-radius:6px}
.empty{padding:48px 0;color:var(--ink-3);text-align:center}

.fab{position:fixed;right:24px;bottom:24px;min-height:52px;padding:0 22px;border-radius:999px;box-shadow:0 6px 20px rgba(47,91,234,.35)}
footer{padding:48px 0 64px;color:var(--ink-3);font-size:.9375rem}

@media (max-width:560px){
  .hero{padding-top:48px;padding-bottom:28px}.hero h1{font-size:1.875rem}.hero p{font-size:1.0625rem}
  nav a.hide-m{display:none}.search{width:100%}.post h2{font-size:1.3125rem}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="#">내<span>블로그</span></a>
    <nav>
      <a class="hide-m" href="#posts">글 목록</a>
      <a class="hide-m" href="#about">소개</a>
      <button class="btn" id="loginBtn">로그인</button>
    </nav>
  </div>
</header>

<main>
  <section class="hero wrap" id="about">
    <small>AI와 함께 만드는 기록</small>
    <h1>바이브코딩으로 배운 것들을<br>차곡차곡 적어둡니다</h1>
    <p>만들면서 막혔던 점, 해결한 방법, 그리고 결정의 이유까지. 공개로 나누고 싶은 글과 나만 보는 메모를 함께 둡니다.</p>
  </section>

  <section class="wrap" id="posts">
    <div class="bar">
      <div class="tabs" role="tablist" aria-label="글 구분">
        <button class="tab" role="tab" aria-selected="true" data-f="all">전체</button>
        <button class="tab" role="tab" aria-selected="false" data-f="public">공개</button>
        <button class="tab" role="tab" aria-selected="false" data-f="private">나만보기</button>
      </div>
      <input class="search" id="q" type="search" placeholder="글 검색" aria-label="글 검색">
    </div>
    <div id="list"></div>
  </section>
</main>

<footer><div class="wrap">© 2026 내블로그 · 디자인 초안 v0.1 (샘플 글입니다)</div></footer>
<button class="btn primary fab" id="writeBtn">글쓰기</button>

<script>
// 샘플 데이터 (실제 DB 연결 전 디자인 확인용)
const posts=[
 {t:"블로그 첫 화면, 디자인부터 잡아봤어요",d:"2026.11.17",v:"public",s:"코드를 짜기 전에 화면 초안부터 정했더니 AI에게 설명하기가 훨씬 쉬워졌습니다.",tags:["디자인","기획"]},
 {t:"프로젝트 의사결정 문서는 왜 필요할까",d:"2026.11.16",v:"public",s:"왜 이 방법을 골랐는지 적어두면 나중에 같은 고민을 반복하지 않습니다.",tags:["문서화","에이전틱코딩"]},
 {t:".env 파일에 API 키 숨기는 법",d:"2026.11.15",v:"private",s:"비밀값은 코드에 직접 쓰지 않고 .env에 넣고, 깃헙에는 올리지 않습니다.",tags:["보안","메모"]},
 {t:"실패 로그: 배포가 안 됐던 이유",d:"2026.11.14",v:"private",s:"환경변수 누락이 원인이었다. 주제별로 문서를 따로 만들어 기록해둘 것.",tags:["실패로그"]},
 {t:"CRUD를 데이터베이스 관점에서 이해하기",d:"2026.11.13",v:"public",s:"만들기(Create), 읽기(Read), 고치기(Update), 지우기(Delete) 네 가지만 알면 됩니다.",tags:["DB","입문"]}
];
let f="all",q="",loggedIn=false;
const $=s=>document.querySelector(s);
function render(){
  const rows=posts.filter(p=>(f==="all"||p.v===f)&&(!q||(p.t+p.s).includes(q))&&(p.v==="public"||loggedIn));
  $("#list").innerHTML=rows.length?rows.map(p=>`
   <a class="post" href="#">
     <div class="meta"><span class="badge ${p.v==="public"?"pub":"priv"}">${p.v==="public"?"공개":"나만보기"}</span><time>${p.d}</time></div>
     <h2>${p.t}</h2><p>${p.s}</p>
     <div class="tags">${p.tags.map(t=>`<span>#${t}</span>`).join("")}</div>
   </a>`).join(""):`<div class="empty">${f==="private"&&!loggedIn?"나만보기 글은 로그인 후 볼 수 있어요.":"표시할 글이 없어요."}</div>`;
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  f=b.dataset.f;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));render();});
$("#q").oninput=e=>{q=e.target.value.trim();render();};
function syncAuth(){$("#loginBtn").textContent=loggedIn?"로그아웃":"로그인";$("#writeBtn").style.display=loggedIn?"inline-flex":"none";render();}
$("#loginBtn").onclick=()=>{loggedIn=!loggedIn;syncAuth();}  // 데모용 토글 (실제 로그인 아님)
syncAuth();
</script>
</body>
</html>
