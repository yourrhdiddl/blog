<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIPM 복습 노트</title>
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("fonts/PretendardVariable.woff2") format("woff2-variations"),url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");}
:root{
  --bg:#fffdf7; --surface:#fff; --ink:#1a1a1a; --ink-2:#444; --ink-3:#6b6b6b; --line:#ece7d9;
  --brand:#2f5bea; --yellow:#ffe66d; --mint:#b8f0d0; --pink:#ffc9dd; --sky:#c6e2ff;
  --lock:#92400e; --lock-soft:#fef3c7; --pub:#166534; --pub-soft:#dcfce7;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:85%;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--ink);
  font-size:1.0625rem;line-height:1.8;letter-spacing:-0.01em;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;
  background:#fffdf8 linear-gradient(135deg,rgba(255,236,170,.38) 0%,rgba(255,250,235,0) 38%,rgba(214,226,255,.32) 100%) fixed;min-height:100vh}
button,input,textarea{font:inherit;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}

/* 형광펜 */
.hl{background:linear-gradient(transparent 52%,var(--yellow) 52%,var(--yellow) 94%,transparent 94%);padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.mint{background-image:linear-gradient(transparent 52%,var(--mint) 52%,var(--mint) 94%,transparent 94%)}
.hl.pink{background-image:linear-gradient(transparent 52%,var(--pink) 52%,var(--pink) 94%,transparent 94%)}
.hl.sky{background-image:linear-gradient(transparent 52%,var(--sky) 52%,var(--sky) 94%,transparent 94%)}
mark{background:none;color:inherit}
mark.y{background:linear-gradient(transparent 45%,var(--yellow) 45%,var(--yellow) 92%,transparent 92%);padding:0 .1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.m{background:linear-gradient(transparent 45%,var(--mint) 45%,var(--mint) 92%,transparent 92%);padding:0 .1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.p{background:linear-gradient(transparent 45%,var(--pink) 45%,var(--pink) 92%,transparent 92%);padding:0 .1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}

header{position:sticky;top:0;background:rgba(255,253,248,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:-0.03em}
.logo span{background:linear-gradient(transparent 55%,var(--yellow) 55%);padding:0 .1em}
nav{display:flex;align-items:center;gap:20px;font-weight:500;color:var(--ink-2);font-size:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:hover{filter:brightness(.95)}

.hero{padding-top:72px;padding-bottom:40px;position:relative}
.eyebrow{display:inline-block;font-weight:700;font-size:.9375rem;background:var(--ink);color:#fff;padding:2px 12px;border-radius:999px;margin-bottom:16px;transform:rotate(-1.5deg)}
.hero h1{font-size:2.625rem;line-height:1.3;font-weight:800;letter-spacing:-0.035em}
.hero p{margin-top:18px;color:var(--ink-2);font-size:1.1875rem;line-height:1.75;max-width:34em}

.picks{margin-top:0;margin-bottom:8px}
.pickrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.note{padding:16px;border-radius:6px;font-size:1rem;line-height:1.6;font-weight:500;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.06);transition:transform .15s}
.note:hover{transform:translateY(-3px) rotate(0)!important}
.note:nth-child(1){background:#fff3a8;transform:rotate(-1deg)}
.note:nth-child(2){background:#c9f5dc;transform:rotate(1deg)}
.note:nth-child(3){background:#ffd6e6;transform:rotate(-.6deg)}
.note small{display:block;margin-top:8px;color:var(--ink-3);font-weight:500;font-size:.8125rem}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:28px 0 16px;border-bottom:2px solid var(--ink)}
.tabs{display:flex;gap:6px}
.tab{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--ink-2);font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:#fff}
.tab:not([aria-selected=true]):hover{background:#f3eedd}
.search{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:200px}

.post{display:block;padding:28px 0;border-bottom:1px solid var(--line)}
.meta{display:flex;align-items:center;gap:10px;font-size:.9375rem;color:var(--ink-3);margin-bottom:8px}
.badge{display:inline-flex;padding:1px 10px;border-radius:999px;font-size:.8125rem;font-weight:700;line-height:1.6}
.badge.pub{background:var(--pub-soft);color:var(--pub)}
.badge.priv{background:var(--lock-soft);color:var(--lock)}
.post h2{font-size:1.5rem;line-height:1.45;font-weight:700;letter-spacing:-0.025em}
.post h2 span{background:linear-gradient(transparent 60%,transparent 60%);transition:background .2s}
.post:hover h2 span{background:linear-gradient(transparent 55%,var(--yellow) 55%,var(--yellow) 94%,transparent 94%)}
.post p{margin-top:8px;color:var(--ink-2)}
.tags{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.tags span{font-size:.875rem;color:#3d3d3d;padding:1px 10px;border-radius:6px}
.tags span:nth-child(3n+1){background:var(--yellow)}.tags span:nth-child(3n+2){background:var(--mint)}.tags span:nth-child(3n){background:var(--pink)}
.empty{padding:48px 0;color:var(--ink-3);text-align:center}

/* 상세 */
.back{display:inline-flex;align-items:center;min-height:44px;margin-top:24px;font-weight:600;color:var(--ink-2);cursor:pointer;background:none;border:0}
.article{padding:16px 0 48px}
.article h1{font-size:2.125rem;line-height:1.4;font-weight:800;letter-spacing:-0.035em;margin:8px 0 8px}
.article .lead{color:var(--ink-2);font-size:1.1875rem;margin-bottom:8px}
.article .body{margin-top:32px;font-size:1.125rem;line-height:1.9}
.article .body p{margin:0 0 1.4em}
.article .body h3{font-size:1.5rem;line-height:1.4;font-weight:800;margin:2em 0 .6em;letter-spacing:-0.03em}
.article .body h3 span{background:linear-gradient(transparent 58%,var(--yellow) 58%,var(--yellow) 94%,transparent 94%);padding:0 .1em}
.article .body ul{margin:0 0 1.4em 1.3em}.article .body li{margin-bottom:.4em}
blockquote{margin:0 0 1.6em;padding:16px 20px;background:#fff8d6;border-left:5px solid #f5c400;border-radius:0 8px 8px 0;font-weight:500}
pre{margin:0 0 1.6em;background:#1f1f24;color:#f3f3f3;padding:16px 20px;border-radius:10px;overflow-x:auto;font:500 .9375rem/1.7 "Pretendard Variable",Pretendard,monospace;white-space:pre}
.sample-note{margin:8px 0 12px;padding:10px 14px;background:var(--lock-soft);color:var(--lock);border-radius:8px;font-size:.9375rem;font-weight:600}
.lock{margin:40px 0;padding:32px;border:2px dashed #e2c26b;border-radius:12px;background:var(--lock-soft);text-align:center}
.lock p{margin:8px 0 16px;color:var(--lock)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
.pn a{padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;line-height:1.5}
.pn a small{display:block;color:var(--ink-3);font-weight:500;font-size:.8125rem}
.pn a:hover{border-color:var(--ink)}

.fab{position:fixed;right:24px;bottom:24px;min-height:52px;padding:0 22px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
footer{padding:48px 0 64px;color:var(--ink-3);font-size:.9375rem}

.card{margin:40px 0;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 24px rgba(60,50,20,.06)}
.card h1{font-size:1.75rem;font-weight:800;letter-spacing:-0.03em;line-height:1.4}
form{display:flex;flex-direction:column;gap:18px;margin-top:20px}
label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.9375rem}
label small{font-weight:500;color:var(--ink-3)}
input[type=text],input[type=email],input[type=password],textarea{min-height:48px;padding:10px 14px;border:1px solid #d9d3c0;border-radius:10px;background:#fff;font-weight:500;line-height:1.7}
textarea{min-height:320px;resize:vertical;font-size:1.0625rem}

/* 글쓰기 편집기 */
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;border:1px solid #d9d3c0;border-bottom:0;border-radius:10px 10px 0 0;background:#faf6e8}
.tb .tbb{min-width:40px;min-height:40px;padding:0 10px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;font-weight:700;color:var(--ink)}
.tb .tbb:hover{background:#fff;border-color:#d9d3c0}
.tb select{min-height:40px;border:1px solid #d9d3c0;border-radius:8px;background:#fff;padding:0 8px;font-weight:600}
.tb .sep{width:1px;height:24px;background:#d9d3c0;margin:0 4px}
.tb .sw{width:26px;min-width:26px;height:26px;min-height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c9c2ac;padding:0;cursor:pointer}
.ed{min-height:340px;padding:14px 16px;border:1px solid #d9d3c0;border-radius:0 0 10px 10px;background:#fff;line-height:1.8;font-weight:500;outline:none}
.ed:focus{border-color:var(--brand)}
.ed:empty:before{content:attr(data-ph);color:#9a947f}
.ed img,.article .body img{max-width:100%;height:auto;border-radius:10px;display:block;margin:12px 0}
.ed h3,.article .body h3{font-size:1.5rem;line-height:1.4;font-weight:800;margin:1.2em 0 .5em}
.ed blockquote,.article .body blockquote{margin:1em 0}
.ed ul,.ed ol,.article .body ol{margin:0 0 1em 1.3em}
.ed p,.ed div{margin:0 0 1em}
.article .body font[size="2"],.ed font[size="2"]{font-size:.85em}
.article .body font[size="5"],.ed font[size="5"]{font-size:1.35em}
.article .body font[size="6"],.ed font[size="6"]{font-size:1.8em}
.article .body font[size="1"],.ed font[size="1"]{font-size:.75em}
.article .body font[size="4"],.ed font[size="4"]{font-size:1.2em}
.article .body font[size="7"],.ed font[size="7"]{font-size:2.4em}
.edhint{font-size:.875rem;color:#6b6552;font-weight:500}
.radios{display:flex;gap:10px}
.radios label{flex-direction:row;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid #d9d3c0;border-radius:999px;background:#fff;cursor:pointer;font-weight:600}
.radios label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.radios input{accent-color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.admin-actions{display:flex;gap:8px;margin:16px 0 0}
.btn.danger{color:#b42318;border-color:#f3c4bf}
.chip{font-size:.8125rem;font-weight:700;background:var(--yellow);padding:2px 10px;border-radius:999px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;z-index:10}
[hidden]{display:none!important}
@media (max-width:620px){
  .hero{padding-top:48px;padding-bottom:28px}.hero h1{font-size:1.9375rem}.hero p{font-size:1.0625rem}
  .pickrow{grid-template-columns:1fr}nav a.hide-m{display:none}.search{width:100%}
  .post h2{font-size:1.3125rem}.article h1{font-size:1.75rem}.article .body{font-size:1.0625rem}.pn{grid-template-columns:1fr}
}
</style>
</head>

const OKT={P:1,DIV:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,H3:1,UL:1,OL:1,LI:1,BLOCKQUOTE:1,FONT:1,IMG:1,A:1};
const BADT=/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META|SVG|MATH|FORM|INPUT|TEXTAREA|BUTTON|SELECT|TEMPLATE|NOSCRIPT)$/;
function clean(h){
  const doc=new DOMParser().parseFromString("<body>"+h,"text/html");
  (function walk(n){[...n.childNodes].forEach(c=>{
    if(c.nodeType===3)return;
    if(c.nodeType!==1){c.remove();return;}
    const t=c.tagName;
    if(BADT.test(t)){c.remove();return;}
    walk(c);
    if(!OKT[t]){c.replaceWith(...c.childNodes);return;}
    const keep={};
    if(t==="FONT"){const col=c.getAttribute("color"),sz=c.getAttribute("size");
      if(col&&/^(#[0-9a-f]{3,8}|rgb\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*\))$/i.test(col))keep.color=col;
      if(sz&&/^[1-7]$/.test(sz))keep.size=sz;}
    if(t==="IMG"){const src=c.getAttribute("src")||"";
      if(!/^(data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+\/=]+|https:\/\/[^\s"'<>]+)$/.test(src)){c.remove();return;}
      keep.src=src;keep.alt=(c.getAttribute("alt")||"").slice(0,200);keep.loading="lazy";}
    if(t==="A"){const href=c.getAttribute("href")||"";
      if(!/^https?:\/\//i.test(href)){c.replaceWith(...c.childNodes);return;}
      keep.href=href;keep.target="_blank";keep.rel="noopener noreferrer";}
    [...c.attributes].forEach(a=>c.removeAttribute(a.name));
    Object.entries(keep).forEach(([k,v])=>c.setAttribute(k,v));
  });})(doc.body);
  return doc.body.innerHTML;
}
function resizeImg(file,max=900){return new Promise((ok,no)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const r=Math.min(1,max/im.width),cv=document.createElement("canvas");
    cv.width=Math.round(im.width*r);cv.height=Math.round(im.height*r);
    const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);
    URL.revokeObjectURL(u);ok(cv.toDataURL("image/jpeg",0.8));};
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("img"));};im.src=u;});}

function parse(txt){const out=[];txt.replace(/\r/g,"").split(/\n{2,}/).forEach(b=>{b=b.trim();if(!b)return;
  if(b.startsWith("```"))out.push(["pre",esc(b.replace(/^```\n?/,"").replace(/\n?```$/,""))]);
  else if(b.startsWith("## "))out.push(["h",esc(b.slice(3))]);
  else if(b.startsWith("> "))out.push(["q",esc(b.slice(2))]);
  else if(b.split("\n").every(l=>l.startsWith("- ")))out.push(["ul",b.split("\n").map(l=>esc(l.slice(2)))]);
  else out.push(["p",esc(b).replace(/\n/g,"<br>")]);});return out;}

  }catch(err){
    console.error(err);btn.disabled=false;btn.textContent="발행하기";
    toast(err.code==="permission-denied"?"관리자만 글을 쓸 수 있어요":"저장하지 못했어요. 다시 시도해 주세요");
  }
});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{f=b.dataset.f;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));renderList();});
$("#q").oninput=e=>{q=e.target.value.trim();renderList();};
$("#loginBtn").onclick=async()=>{if(loggedIn){await signOut(auth);toast("로그아웃했어요");show("home",0,true);}else show("login",0,true);};
document.addEventListener("click",async e=>{
  if(e.target.id!=="googleBtn")return;
  try{await signInWithPopup(auth,new GoogleAuthProvider());}
  catch(err){console.error(err);const m=$("#loginMsg");if(m){m.textContent="로그인하지 못했어요. 팝업 차단을 풀고 다시 눌러 주세요.";m.style.color="#b42318";}}
});
onAuthStateChanged(auth,async u=>{
  user=u;loggedIn=!!u&&(!ADMIN_UID||u.uid===ADMIN_UID);
  syncAuth();await loadRemote();
  if(u&&loggedIn&&!$("#page").hidden&&$("#loginForm,#googleBtn")){const n=after;after=null;toast("관리자로 로그인했어요");show(n?n.view:"home",0,true);}
  else if(u&&!loggedIn){toast("관리자 계정이 아니에요");await signOut(auth);}
  else fromHash();
});
function fromHash(){const m=location.hash.match(/^#\/post\/([\w-]+)/);if(m)return show("post",m[1],false);
  const w=location.hash.match(/^#\/(login|write)/);show(w?w[1]:"home",0,false);}
window.addEventListener("hashchange",fromHash);syncAuth();fromHash();
</script>
</body>
</html>
